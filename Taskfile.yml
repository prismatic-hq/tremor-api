version: "3"

dotenv: [".env"]

vars:
  IMAGE: tremor-api:local

tasks:
  init:
    desc: Install dependencies, git hooks and a local .env
    cmds:
      - uv sync --locked
      - uv run pre-commit install
      - test -f .env || cp .env.example .env

  lint:
    desc: Lint and check formatting
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .

  dev:
    desc: Run Postgres in Docker and the API with hot reload
    cmds:
      - docker compose up -d --wait db
      - uv run alembic upgrade head
      - uv run uvicorn --factory tremor_api.main:create_app --reload --port {{.API_PORT | default "8001"}}

  test:
    desc: Run tests against Postgres in testcontainers
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  build:
    desc: Build the container image
    cmds:
      - docker build -t {{.IMAGE}} .

  up:
    desc: Start Postgres, run migrations and start the API in Docker
    cmds:
      - docker compose up -d --build --wait api

  down:
    desc: Stop the local stack
    cmds:
      - docker compose down
