name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: tremor-api
  BUILD_CACHE_REPOSITORY: build-cache
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.repository_owner == 'prismatic-hq' && vars.AWS_ROLE_ARN != '' }}
    outputs:
      published: ${{ steps.image.outputs.published }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - if: env.PUBLISH == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - if: env.PUBLISH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          printf 'tag=%s\npublished=%s\n' "$tag" "$PUBLISH" >> "$GITHUB_OUTPUT"
          if [ "$PUBLISH" != "true" ]; then
            {
              echo "exists=false"
              echo "cache-from=type=gha,scope=$IMAGE_NAME"
              echo "cache-to=type=gha,scope=$IMAGE_NAME,mode=max"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if result=$(aws ecr describe-images --repository-name "$IMAGE_NAME" --image-ids imageTag="$tag" 2>&1); then
            exists=true
          elif grep -q ImageNotFoundException <<<"$result"; then
            exists=false
          else
            echo "::error::cannot check $IMAGE_NAME:$tag in ECR: $result"
            exit 1
          fi
          repository="$REGISTRY/$IMAGE_NAME"
          cache="$REGISTRY/$BUILD_CACHE_REPOSITORY:$IMAGE_NAME"
          {
            echo "exists=$exists"
            echo "repository=$repository"
            echo "cache-from=type=registry,ref=$cache"
            echo "cache-to=type=registry,ref=$cache,mode=max,image-manifest=true,oci-mediatypes=true"
            echo "tags<<EOF"
            echo "$repository:$tag"
            if [ "$BRANCH" = "main" ]; then echo "$repository:main"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - if: steps.image.outputs.exists == 'true'
        run: echo "::notice::$IMAGE_NAME:${{ steps.image.outputs.tag }} already in ECR; skipping build"
      - if: steps.image.outputs.exists == 'true' && github.ref_name == 'main'
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          TAG: ${{ steps.image.outputs.tag }}
        run: docker buildx imagetools create --tag "$REPOSITORY:main" "$REPOSITORY:$TAG"
      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - if: steps.image.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: ${{ steps.image.outputs.cache-from }}
          cache-to: ${{ steps.image.outputs.cache-to }}

  preview:
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref_name != 'main' && needs.build.outputs.published == 'true'
    permissions:
      contents: read
      checks: write
      deployments: write
      statuses: write
      pull-requests: write
    uses: prismatic-hq/caldera-platform/.github/workflows/preview-environment.yml@main
    with:
      repo: ${{ github.event.repository.name }}
      branch: ${{ github.ref_name }}
      sha: ${{ github.sha }}
    secrets:
      CALDERA_TOKEN: ${{ secrets.CALDERA_TOKEN }}
